name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing: npm verifies this workflow's
      # OIDC identity instead of a long-lived token, so no NPM_TOKEN secret
      # exists to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The tag is the only input, so a tag that disagrees with the
      # manifest would publish a version nobody asked for. Refuse instead.
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag disagrees with package.json $manifest"
            exit 1
          fi

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # Catches a broken tarball before anything is published, which is
      # the one failure a publish cannot take back.
      - name: Validate the tarball
        run: pnpm publish --dry-run --no-git-checks

      # `pnpm publish`, not `npm publish`, and deliberately NO
      # `NODE_AUTH_TOKEN`. This authenticates by npm Trusted Publishing
      # (OIDC), which `permissions: id-token: write` above enables and
      # pnpm performs itself. There is no npm token in this repository
      # and there is not meant to be one.
      #
      # Setting NODE_AUTH_TOKEN from a secret that does not exist is
      # actively harmful rather than merely redundant — the sibling
      # @vymalo/vsms-node release learnt this on its own v0.2.0:
      # `actions/setup-node`'s `registry-url` writes an `.npmrc`
      # containing `_authToken=${NODE_AUTH_TOKEN}`, so an unset secret
      # becomes an *empty* token rather than no token, and npm masks a
      # bad credential as `E404 PUT https://registry.npmjs.org/...`
      # rather than confirm to an unauthenticated caller whether a
      # package exists. Whoever reads that log goes hunting for a missing
      # package instead of a missing publisher.
      #
      # Requires Trusted Publishing to be configured for @vaam-apps/ui on
      # npmjs.com against this repository and this workflow filename.
      #
      # THE FIRST PUBLISH CANNOT USE THIS WORKFLOW. A trusted publisher
      # attaches to an existing package — npm's own setup instructions
      # begin "navigate to your package settings", and there are no
      # settings for a name nobody has published. So a greenfield package
      # has a bootstrap step that OIDC cannot perform, and skipping it
      # produces exactly this, which reads like a missing package rather
      # than a missing publisher:
      #
      #   [WARN] Skipped OIDC: ERR_PNPM_AUTH_TOKEN_EXCHANGE: Failed token
      #          exchange request with body message: Unknown error (404)
      #   x Failed to publish @vaam-apps/ui@0.1.0 (status 404 Not Found)
      #
      # Note the GitHub side succeeded — the OIDC token was issued (200);
      # it is npm that has nobody to exchange it with.
      #
      # Bootstrap, once, by hand, from a maintainer's machine:
      #
      #   npm login                       # 2FA
      #   pnpm install
      #   pnpm publish --access public    # prepack rebuilds
      #
      # then add the trusted publisher on npmjs.com (repo vaam-apps/ui,
      # workflow release.yml) and every later tag publishes tokenlessly
      # through this job. Do not re-run the tag whose version was
      # published by hand — npm refuses to republish a version.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: pnpm publish --access public --provenance --no-git-checks
