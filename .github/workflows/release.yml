name: Release

# Publishes to npm. This file's NAME and its `push: tags:` trigger are
# deliberately untouched by the move to release-please
# (`.github/workflows/release-please.yml`, which now proposes the version
# and creates the tag): npm's Trusted Publisher for `@vaam-apps/ui` is
# bound to this repository plus this exact workflow filename, so renaming
# or restructuring it — even in a way that changes nothing else — breaks
# publishing until the trusted publisher entry on npmjs.com is repointed.
# If this file is ever renamed, do that first.

on:
  push:
    tags: ['v*.*.*']

  # `.github/workflows/release-please.yml` — which replaced the old
  # `version.yml` — mints a real GitHub App token and uses it to push the
  # release tag, so that push is a genuine event and the trigger above
  # fires it on its own; nothing has to relay it here any more.
  #
  # This stays only as a manual escape hatch: re-running a publish that
  # failed partway (`gh workflow run release.yml --ref v<version>`)
  # without needing a new tag. The guard below insists on a real tag ref
  # regardless of which trigger fired, so a manual dispatch against
  # `main` fails with a readable error rather than silently comparing
  # `main` to a version number.
  #
  # This is NOT made a reusable `workflow_call` for the same reason it
  # never was: npm matches its trusted publisher against this workflow's
  # own identity (this repository, this filename), and being called from
  # another workflow changes that claim. Breaking it would only show up
  # at publish time, which is why this file's name and structure are
  # untouched by the move to release-please — see the file-level comment
  # above.
  workflow_dispatch:

# Never cancel a publish. This was a real gap relative to
# `vaam-apps/vsms`'s own `release.yml`, which already has this block —
# without it, a second trigger against the same ref (a manual re-dispatch
# racing the tag push that's already running this workflow) can cancel a
# `pnpm publish` mid-flight, which is the one failure here that cannot be
# re-run into a clean state: npm refuses to republish a version, so a
# cancelled partial publish leaves nothing to retry against. Keyed per
# ref, matching `release-please.yml`'s own group, so this can never be
# cancelled by an unrelated push either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing: npm verifies this workflow's
      # OIDC identity instead of a long-lived token, so no NPM_TOKEN secret
      # exists to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; nothing here needs the checkout's own
          # git credentials to persist past the step that made them.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          # Deliberately NO `cache: pnpm` here, unlike `ci.yml`/`version.yml`,
          # and `package-manager-cache` explicitly forced off. This job runs
          # on a tag push and ends by publishing to npm — exactly the
          # "runtime artifacts" shape a poisoned dependency cache would
          # target, and a publish is the one failure this repository cannot
          # take back. setup-node v7 added `package-manager-cache`, DEFAULT
          # true, which auto-enables caching from `package.json`'s own
          # `packageManager` field with no `cache:` input needed at all — so
          # leaving it at its default is not the same as omitting caching
          # here, it is a second, easier-to-miss way to get it. Confirmed by
          # re-running zizmor's `cache-poisoning` audit before and after this
          # line: it still fired with only `cache:` removed, and stopped
          # once this was added.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The tag is the only input, so a tag that disagrees with the
      # manifest would publish a version nobody asked for. Refuse instead.
      #
      # The ref check came with `workflow_dispatch`: that trigger will
      # happily run this on `main`, where `GITHUB_REF_NAME` is `main` and
      # the comparison below would report `tag vmain disagrees with
      # package.json 0.1.2` — true, but it reads like a version mismatch
      # rather than "you dispatched this on the wrong ref", which is the
      # mistake actually being made.
      - name: Must run on a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::release must run on a v* tag ref, got $GITHUB_REF. Dispatch it with --ref v<version>, or let release-please.yml create the tag for you."
              exit 1
              ;;
          esac

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag disagrees with package.json $manifest"
            exit 1
          fi

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # Catches a broken tarball before anything is published, which is
      # the one failure a publish cannot take back.
      - name: Validate the tarball
        run: pnpm publish --dry-run --no-git-checks

      # `pnpm publish`, not `npm publish`, and deliberately NO
      # `NODE_AUTH_TOKEN`. This authenticates by npm Trusted Publishing
      # (OIDC), which `permissions: id-token: write` above enables and
      # pnpm performs itself. There is no npm token in this repository
      # and there is not meant to be one.
      #
      # Setting NODE_AUTH_TOKEN from a secret that does not exist is
      # actively harmful rather than merely redundant — the sibling
      # @vymalo/vsms-node release learnt this on its own v0.2.0:
      # `actions/setup-node`'s `registry-url` writes an `.npmrc`
      # containing `_authToken=${NODE_AUTH_TOKEN}`, so an unset secret
      # becomes an *empty* token rather than no token, and npm masks a
      # bad credential as `E404 PUT https://registry.npmjs.org/...`
      # rather than confirm to an unauthenticated caller whether a
      # package exists. Whoever reads that log goes hunting for a missing
      # package instead of a missing publisher.
      #
      # Requires Trusted Publishing to be configured for @vaam-apps/ui on
      # npmjs.com against this repository and this workflow filename.
      #
      # THE FIRST PUBLISH CANNOT USE THIS WORKFLOW. A trusted publisher
      # attaches to an existing package — npm's own setup instructions
      # begin "navigate to your package settings", and there are no
      # settings for a name nobody has published. So a greenfield package
      # has a bootstrap step that OIDC cannot perform, and skipping it
      # produces exactly this, which reads like a missing package rather
      # than a missing publisher:
      #
      #   [WARN] Skipped OIDC: ERR_PNPM_AUTH_TOKEN_EXCHANGE: Failed token
      #          exchange request with body message: Unknown error (404)
      #   x Failed to publish @vaam-apps/ui@0.1.0 (status 404 Not Found)
      #
      # Note the GitHub side succeeded — the OIDC token was issued (200);
      # it is npm that has nobody to exchange it with.
      #
      # Bootstrap, once, by hand, from a maintainer's machine:
      #
      #   npm login                       # 2FA
      #   pnpm install
      #   pnpm publish --access public    # prepack rebuilds
      #
      # then add the trusted publisher on npmjs.com (repo vaam-apps/ui,
      # workflow release.yml) and every later tag publishes tokenlessly
      # through this job. Do not re-run the tag whose version was
      # published by hand — npm refuses to republish a version.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: pnpm publish --access public --provenance --no-git-checks
