# Cuts a release: consumes the pending changesets, stamps the changelog,
# tags, and hands the tag to `release.yml`.
#
# Run it from the Actions tab. It is the only button; everything else in
# the release path is a consequence of it.
#
# # Why this ends in a `workflow_dispatch` instead of just pushing a tag
#
# `release.yml` triggers on `push: tags: ['v*.*.*']`, and this job pushes
# exactly such a tag — which is not enough, and the reason is a documented
# GitHub rule rather than a bug to work around:
#
#   "When you use the repository's GITHUB_TOKEN to perform tasks, events
#    triggered by the GITHUB_TOKEN will not create a new workflow run,
#    with the following exceptions: workflow_dispatch, repository_dispatch."
#
# So a tag pushed from here fires nothing. The alternatives were a
# personal access token — this repository deliberately has no publishing
# credential, see `release.yml`'s comment on Trusted Publishing — or
# making `release.yml` a reusable workflow and calling it, which changes
# the OIDC claim npm matches its trusted publisher against and would
# break publishing in a way only discoverable by publishing. Dispatching
# it explicitly, at the tag ref, keeps `release.yml` byte-identical in the
# eyes of npm: same filename, same trigger path from its own perspective.
name: Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Only used when no changesets are pending: writes one of this
          size so a release can go out without a prior `pnpm changeset`.
          Leave as "none" to require the normal flow.
        type: choice
        options: [none, patch, minor, major]
        default: none
      dry_run:
        description: "Do everything except push the commit, the tag, and the release."
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      # Push the bump commit and the tag.
      contents: write
      # Dispatch `release.yml`.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # `changeset version` reads tags to work out what it is bumping
          # from, and the push below needs real history behind it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `.changeset/README.md` is documentation, not a changeset, so it is
      # excluded by name — counting every `.md` in there would make the
      # directory permanently look non-empty and this guard permanently
      # pass.
      - name: There must be something to release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "pending changesets: $pending"
          if [ "$pending" -gt 0 ]; then
            exit 0
          fi
          if [ "$BUMP" = "none" ]; then
            echo "::error::No pending changesets. Add one with \`pnpm changeset\` in the PR that needs it, or re-run this workflow with a \`bump\` size to write one now."
            exit 1
          fi
          # The escape hatch, written into the repository rather than
          # applied invisibly, so the release still leaves a record of
          # which size was chosen and that nobody chose it in a PR.
          cat > ".changeset/release-${GITHUB_RUN_ID}.md" <<CHANGESET
          ---
          "@vaam-apps/ui": $BUMP
          ---

          Release cut from the Version workflow with an explicit \`$BUMP\` bump and no pending changeset. The entry for this release is in CHANGELOG.md.
          CHANGESET
          echo "wrote a $BUMP changeset"

      - name: Bump the version
        run: pnpm bump

      - id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $version"

      # Refuses an empty `## Unreleased`, which is the whole reason this
      # is a script with its own tests rather than a `sed` here — see
      # `scripts/stamp-changelog.mjs` and `src/lib/stamp-changelog.test.ts`.
      - name: Stamp the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/stamp-changelog.mjs "$VERSION"

      # `release.yml` runs these again before publishing, and that is not
      # redundant: running them *here* means a failure leaves no tag
      # behind. A tag that exists but never published is the awkward
      # state — it cannot be reused once pushed, and deleting a pushed tag
      # to retry is exactly the kind of history edit nobody wants to do
      # under release pressure.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Commit, tag, push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v$VERSION"
          git tag -a "$TAG" -m "$TAG"
          # The commit first: a tag reachable from main is a tag someone
          # can check out later. Pushing the tag first would leave it
          # dangling for as long as the branch push takes, and orphaned
          # entirely if that push is rejected.
          git push origin HEAD:main
          git push origin "$TAG"

      # See this file's header for why this is a dispatch and not the tag
      # push above doing the work.
      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          echo "::notice::dispatched release.yml at $TAG"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::dry run — would have released $VERSION. Nothing was pushed."
          git --no-pager diff --stat
