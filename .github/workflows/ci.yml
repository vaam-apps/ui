name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be re-run by hand from the Actions tab against any ref.
  #
  # Added after a pull request that touched this very file opened with no
  # CI run at all — no queued run, nothing awaiting approval, the workflow
  # still `active` — and there was no way to ask for one. Closing and
  # reopening the PR did not fire it either. Every other check on that PR
  # was green, which is the dangerous shape: a check list that looks
  # passing while the gate that matters never ran.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Builds the published artifact, which `tsc --noEmit` above does NOT
      # exercise: declaration emit has its own failure modes (this package
      # has already hit TS2742 on a re-exported type that could not be
      # named through pnpm's virtual store) and they are invisible until
      # something actually emits.
      - name: Build the package
        run: pnpm run build

      # A published tarball that is missing files, or whose entry points
      # point at paths that are not in it, fails only for the consumer.
      # Packing and reading the result is the cheapest way to see it here.
      - name: Pack and verify the tarball
        run: |
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/vaam-apps-ui-*.tgz | sed 's|^package/||' | sort > /tmp/contents.txt
          for required in dist/index.js dist/index.d.ts dist/styles/theme.css README.md LICENSE; do
            grep -qx "$required" /tmp/contents.txt \
              || { echo "::error::$required missing from the tarball"; exit 1; }
          done
          grep -q '\.test\.' /tmp/contents.txt \
            && { echo "::error::test files leaked into the tarball"; exit 1; }
          # 0.1.0 shipped the whole source tree: `files` was unset, so npm's
          # own defaults packed src/ alongside dist/, and the declaration
          # maps pointed into it. Nothing here caught that, because every
          # assertion above is about a file being present. Absence needs its
          # own check.
          grep -q '^src/' /tmp/contents.txt \
            && { echo "::error::src/ leaked into the tarball (see files: in package.json)"; exit 1; }
          grep -q '\.map$' /tmp/contents.txt \
            && { echo "::error::source maps leaked into the tarball; they dangle without src/"; exit 1; }
          # `tsconfig.build.json` excludes stories from the compile, but
          # `copy-styles.mjs` used to copy all of `src/styles/` verbatim —
          # so the moment a story was added there, an uncompiled `.tsx`
          # went straight into dist/ and into the tarball, under a path
          # that starts with `dist/` and so passed every check above.
          # Found by listing dist/ after a build. Assert the absence.
          grep -qE '\.(tsx|jsx)$' /tmp/contents.txt \
            && { echo "::error::uncompiled source (.tsx/.jsx) leaked into the tarball"; exit 1; }
          grep -q '\.stories\.' /tmp/contents.txt \
            && { echo "::error::stories leaked into the tarball"; exit 1; }
          echo "tarball contains $(wc -l < /tmp/contents.txt) files"

      - name: Build Storybook
        run: pnpm run build-storybook
